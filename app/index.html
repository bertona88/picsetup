<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a09"><title>PicSetup Detector Bench</title><link rel="stylesheet" href="./styles.css"></head>
<body><main>
<header><div><small>PICSETUP / COMPONENT LAB</small><h1>Detector bench</h1></div><span class="live">● signal live</span></header>
<section class="workspace"><div class="beam"><div class="source"><b id="sourceWavelength">532 nm</b><span id="sourcePower">2.40 mW</span></div><div class="ray"></div><div id="port" class="port"><b id="portSymbol">+</b><span id="portName">Connect a detector</span></div></div>
<aside><div class="screen-head"><div><small>DETECTED SIGNAL</small><h2 id="screenTitle">No detector connected</h2></div><button id="disconnect" disabled>Disconnect</button></div><p id="description">Select an instrument and connect it to show only the properties it measures.</p><div id="visuals" class="visuals"></div><div id="metrics" class="metrics"></div><p id="caveat" class="caveat" hidden></p></aside></section>
<section class="drawer"><div class="controls"><div class="section-title"><div><small>INCOMING LIGHT</small><h2>Signal controls</h2></div><label class="pulse"><input id="pulsed" type="checkbox" checked> Pulsed</label></div><div class="sliders">
<label>Power <output id="powerOut"></output><input id="power" type="range" min="0.01" max="10" step="0.01" value="2.4"></label>
<label>Beam diameter <output id="diameterOut"></output><input id="diameter" type="range" min="0.2" max="4" step="0.01" value="1.2"></label>
<label>Wavelength <output id="wavelengthOut"></output><input id="wavelength" type="range" min="405" max="1650" step="1" value="532"></label>
<label>Divergence <output id="divergenceOut"></output><input id="divergence" type="range" min="0" max="5" step="0.01" value="1.1"></label></div></div>
<div><div class="section-title"><div><small>COMPONENTS / DETECTORS</small><h2>Choose a detector</h2></div><button id="connect" disabled>Connect to screen</button></div><div id="catalog" class="catalog"></div></div></section>
</main><script type="module" src="./main.js"></script></body></html>
