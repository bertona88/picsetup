name: Validate fresh photonic playground
on:
  pull_request:
    paths: ['playground/**', 'scripts/*siepic*.py', '.github/workflows/playground.yml']
  push:
    branches: ['rebuild/playground-m1']
    paths: ['playground/**', 'scripts/*siepic*.py', '.github/workflows/playground.yml']
permissions:
  contents: read
jobs:
  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: python3 ../scripts/convert_siepic.py --check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-api.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence
          path: |
            playground/dist/
            playground/dist-api/
            playground/evidence/*.png
            playground/evidence/*.json
            playground/test-results/
